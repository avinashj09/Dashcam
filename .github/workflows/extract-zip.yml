
name: Extract LiveDashcam ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p /tmp/livedashcam
          unzip -o LiveDashcam_Android_Upload.zip -d /tmp/livedashcam
          cp -R /tmp/livedashcam/android .
          cp /tmp/livedashcam/UPLOAD_INSTRUCTIONS.md .

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android UPLOAD_INSTRUCTIONS.md
          git commit -m "Extract LiveDashcam Android project"
          git push
